[package]
name = "swarm"
description = "Live mesh nodes: swarm-worker (SNN+firewall enforcement) + swarm-orchestrator (control plane)"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json = "1"
snn-mesh = { path = "../snn-mesh" }
snn-firewall = { path = "../snn-firewall" }
snn-runtime = { path = "../snn-runtime" }
windows-service = "0.8.1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
native-windows-gui = "1.0.13"
wry = "0.57.1"
tao = "0.37.2"

[[bin]]
name = "swarm-worker"
path = "src/bin/swarm_worker.rs"

[[bin]]
name = "swarm-orchestrator"
path = "src/bin/swarm_orchestrator.rs"

[build-dependencies]
embed-resource = "3.0.12"
