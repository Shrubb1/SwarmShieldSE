[package]
name = "snn-wasm"
description = "Wasm/browser shim over snn-runtime's JsonApi"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json = "1"
snn-runtime = { path = "../snn-runtime" }
snn-mesh = { path = "../snn-mesh" }
snn-firewall = { path = "../snn-firewall" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
getrandom = { version = "0.3", features = ["wasm_js"] }
