<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SwarmShield Pro — sign up</title>
<style>
  body{font-family:system-ui;background:#0d1117;color:#e6edf3;margin:0;padding:40px;max-width:560px;margin:auto}
  .card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:22px;margin:18px 0}
  input{width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid #30363d;background:#0d1117;color:#e6edf3;box-sizing:border-box}
  .btn{background:#238636;color:#fff;padding:12px 20px;border-radius:8px;border:0;font-weight:600;cursor:pointer}
  .muted{color:#8b949e;font-size:13px}
</style>
</head>
<body>
<h1>SwarmShield Pro</h1>
<div class="card">
  <p class="muted">Weekly subscription. Verify email → pay → your token
  is issued instantly and emailed to you.</p>
  <!-- dev/demo: hits the license_server endpoints directly; in prod
       these route through your backend which bills via Stripe first. -->
  <form id="signup" method="get" action="http://127.0.0.1:9100/issue">
    <input name="email" type="email" placeholder="email" required>
    <input name="days" type="hidden" value="7">
    <button class="btn" type="submit">Continue to payment</button>
  </form>
  <p class="muted">After payment: token <code>SS-SE-XXXX…</code> →
  <code>swarmshield --token &lt;token&gt; …</code></p>
</div>
<div class="card">
  <h3>Already paid? Lost your token?</h3>
  <form method="get" action="http://127.0.0.1:9100/forgot">
    <input name="email" type="email" placeholder="email" required>
    <button class="btn" type="submit">Re-issue token</button>
  </form>
</div>
</body>
</html>
