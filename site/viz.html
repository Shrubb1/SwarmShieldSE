<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SwarmShieldSE — live pipeline</title>
<style>
  body{margin:0;background:#0b0e14;color:#e6edf3;font-family:system-ui;overflow:hidden}
  #hud{position:fixed;top:14px;left:16px;z-index:5}
  #hud h1{margin:0;font-size:1.1rem;color:#3fb950}
  #hud a{color:#58a6ff;font-size:.8rem}
  #feed{position:fixed;bottom:14px;left:16px;right:16px;height:110px;overflow:hidden;
    font-family:ui-monospace,Consolas,monospace;font-size:.8rem;color:#8b949e;z-index:5;
    background:#0d1117cc;border:1px solid #21262d;border-radius:8px;padding:8px}
  #feed div{white-space:nowrap}
</style>
</head>
<body>
<div id="hud"><h1>🛡 SwarmShieldSE — inside the engine</h1>
<a href="/">← back</a> · simulated traffic, real pipeline order</div>
<div id="feed"></div>
<canvas id="cv"></canvas>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
function fit(){cv.width=innerWidth;cv.height=innerHeight;}
fit();addEventListener('resize',fit);
const W=()=>cv.width,H=()=>cv.height,CY=.46;

const STAGES=[{x:.14,c:'#8b949e',n:'internet'},{x:.30,c:'#d29922',n:'scout'},
  {x:.47,c:'#58a6ff',n:'window+SNN brain'},{x:.64,c:'#d2a8ff',n:'rules'}];
const OK={x:.87,y:CY-.11,c:'#3fb950',n:'your app'},TRAP={x:.87,y:CY+.11,c:'#f85149',n:'tarpit'};

const HOSTILES=["is checking in on a schedule — like malware phoning home",
  "sent a flood — too many requests too fast","suspicious payload — sqlmap-style",
  "tried to sneak in malicious code","is probing for open doors"];
const GOODS=["looks normal, let them through","regular traffic — all good"];
const feed=document.getElementById('feed');
function say(t,c){const d=document.createElement('div');d.textContent=t;d.style.color=c;
  feed.appendChild(d);while(feed.children.length>6)feed.removeChild(feed.firstChild);}

const pkts=[];
function spawn(hostile){
  pkts.push({x:.02,y:CY+(Math.random()-.5)*.14,hostile,phase:'in'});
}
function ring(x,y,r,col,lw){ctx.strokeStyle=col;ctx.lineWidth=lw;
  ctx.beginPath();ctx.arc(x*W(),y*H(),r,0,7);ctx.stroke();}
function box(x,y,s,c,g){ctx.fillStyle=c;ctx.shadowColor=c;ctx.shadowBlur=g;
  ctx.fillRect(x*W()-s/2,y*H()-s/2,s,s);ctx.shadowBlur=0;}
function label(t,x,y,c){ctx.fillStyle=c||'#8b949e';ctx.font='12px system-ui';
  ctx.textAlign='center';ctx.fillText(t,x*W(),y*H());}

let t=0;
function anim(){requestAnimationFrame(anim);t+=.016;
  ctx.fillStyle='#0b0e14';ctx.fillRect(0,0,W(),H());
  STAGES.forEach(s=>{ring(s.x,CY,40,s.c,3);label(s.n,s.x,CY-.08);});
  box(OK.x,OK.y,58,OK.c,16);box(TRAP.x,TRAP.y,58,TRAP.c,16);
  label(OK.n,OK.x,OK.y-.08,'#3fb950');label(TRAP.n,TRAP.x,TRAP.y+.10,'#f85149');
  // SNN brain pulse at the brain stage
  const bx=STAGES[2].x;
  ring(bx,CY,26+Math.sin(t*3)*7,'rgba(88,166,255,.4)',1);
  ctx.fillStyle='#1f6feb';ctx.beginPath();ctx.arc(bx*W(),CY*H(),10,0,7);ctx.fill();

  if(Math.random()<.03)spawn(Math.random()<.18);
  for(let i=pkts.length-1;i>=0;i--){const p=pkts[i];
    if(p.phase==='in'){p.x+=.007;
      if(p.x>=.60){p.phase='exit';
        const ip=`${~~(Math.random()*254)+1}.${~~(Math.random()*255)}.${~~(Math.random()*255)}.${~~(Math.random()*255)}`;
        if(p.hostile){say(`[ !! ] ${ip} ${HOSTILES[~~(Math.random()*HOSTILES.length)]}`,'#f85149');
          setTimeout(()=>say(`[TRAP] ${ip} → stuck in the tar — wasting their time`,'#d29922'),400);
        }else{say(`[ ok ] ${ip} ${GOODS[~~(Math.random()*GOODS.length)]}`,'#3fb950');}}
    }else{const tgt=p.hostile?TRAP:OK;
      p.y+=Math.sign(tgt.y-p.y)*.004;
      p.x+=p.hostile?.0018:.006; // tarpit = slow crawl
      if(p.hostile&&p.x>TRAP.x-.02){p.x=TRAP.x-.02;p.rot=(p.rot||0)+.1;
        if(p.rot>40){pkts.splice(i,1);continue;}}
      if(p.x>.98){pkts.splice(i,1);continue;}}
    ctx.save();ctx.translate(p.x*W(),p.y*H());ctx.rotate(p.rot||0);
    const c=p.hostile?(p.phase==='exit'?'#994540':'#f85149'):'#3fb950';
    ctx.fillStyle=c;ctx.shadowColor=c;ctx.shadowBlur=9;
    ctx.beginPath();ctx.arc(0,0,5,0,7);ctx.fill();ctx.restore();ctx.shadowBlur=0;
  }
}
anim();
</script>
</body>
</html>
