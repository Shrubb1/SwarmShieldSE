[workspace]
resolver = "2"
members = [
    "crates/snn-core",
    "crates/snn-encode",
    "crates/snn-learn",
    "crates/snn-io",
    "crates/snn-mesh",
    "crates/snn-firewall",
    "crates/snn-runtime",
    "crates/snn-wasm",
    "crates/swarm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
sprs = "0.11"
rayon = "1.10"
rand = "0.9"
